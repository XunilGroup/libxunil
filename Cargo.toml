[package]
name = "libxunil"
version = "0.1.0"
edition = "2024"

[lib]
name = "xunil"
crate-type = ["staticlib", "rlib"]
test = false
bench = false

[profile.release]
panic = "abort"
opt-level = "s"

[dependencies]
bitflags = "2.11.1"
font8x8 = { version = "0.3.1", default-features = false }
spin = "0.10.0"

[profile.dev]
panic = "abort"

[profile.test]
panic = "abort"
